
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Видео на ТВ</title>

  <script>
    window.__onGCastApiAvailable = function (available) {
      if (!available) {
        document.querySelector("#status").textContent =
          "Google Cast недоступен в этом браузере";
        return;
      }
      const context = cast.framework.CastContext.getInstance();
      context.setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
      });
      window.castContext = context;
      document.querySelector("#status").textContent =
        "Готово. Нажмите 'Подключить ТВ' и выберите телевизор";
    };
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <style>
    :root {
      --bg: #101114;
      --text: white;
      --input-bg: #1d1f24;
      --border: #444;
      --btn-primary: #2979ff;
      --btn-cast: #4285f4;
      --btn-upload: #34a853;
      --warning-bg: #332200;
      --warning-text: #ffaa00;
      --success-text: #66ff66;
      --error-text: #ff4444;
      --status-color: #aaa;
    }
    body.light {
      --bg: #f0f2f5;
      --text: #1a1a1a;
      --input-bg: white;
      --border: #ccc;
      --btn-primary: #1976d2;
      --btn-cast: #1a73e8;
      --btn-upload: #2e7d32;
      --warning-bg: #fff3cd;
      --warning-text: #856404;
      --success-text: #155724;
      --error-text: #721c24;
      --status-color: #333;
    }
    body.deuteranopia {
      --bg: #000000;
      --text: #ffffff;
      --input-bg: #222222;
      --border: #ffffff;
      --btn-primary: #ffaa00;
      --btn-cast: #00ddff;
      --btn-upload: #ff8800;
      --warning-bg: #444400;
      --warning-text: #ffff00;
      --success-text: #88ff88;
      --error-text: #ff8888;
      --status-color: #dddddd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      transition: background 0.2s, color 0.2s;
    }
    main {
      width: min(600px, 100%);
      margin: auto;
    }
    h1 { margin-top: 0; }
    input, button, .file-upload-wrapper, select {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 16px;
      transition: background 0.2s, border 0.2s, color 0.2s;
    }
    select {
      appearance: auto;
      cursor: pointer;
    }
    select option {
      background: var(--input-bg);
      color: var(--text);
    }
    button {
      background: var(--btn-primary);
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    button:active { opacity: 0.75; }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #myCastButton { background: var(--btn-cast); }
    #uploadButton { background: var(--btn-upload); }
    .file-upload-wrapper {
      background: transparent;
      border: 2px dashed var(--border);
      text-align: center;
      padding: 20px;
      cursor: pointer;
    }
    .file-upload-wrapper input[type="file"] { display: none; }
    .file-upload-wrapper label { display: block; cursor: pointer; }
    #file-warning {
      font-size: 14px;
      text-align: center;
      margin: 4px 0 12px;
      padding: 8px;
      border-radius: 6px;
      background: var(--warning-bg);
      color: var(--warning-text);
      transition: background 0.2s, color 0.2s;
    }
    #status {
      color: var(--status-color);
      text-align: center;
      line-height: 1.4;
      transition: color 0.2s;
    }
    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 8px;
      background: black;
    }
    .theme-switcher {
      display: flex;
      gap: 10px;
      margin: 12px 0;
      justify-content: center;
      flex-wrap: wrap;
    }
    .theme-switcher button {
      flex: 1;
      min-width: 80px;
      padding: 10px;
      font-size: 14px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 30px;
      cursor: pointer;
      font-weight: normal;
    }
    .theme-switcher button.active {
      border-color: var(--btn-primary);
      background: var(--btn-primary);
      color: white;
    }
    .theme-switcher button:active { opacity: 0.7; }
    .manual-link-hint {
      font-size: 13px;
      color: var(--status-color);
      text-align: center;
      margin-top: 4px;
    }
    .url-hint {
      font-size: 13px;
      color: #ffaa00;
      text-align: center;
      margin-top: -4px;
      margin-bottom: 8px;
    }
    .service-selector {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
    }
    .service-selector label {
      white-space: nowrap;
      font-size: 14px;
    }
    .service-selector select {
      flex: 1;
      margin: 0;
    }
  </style>
</head>

<body>
<main>
  <h1>Видео на телевизор</h1>

  <div class="theme-switcher">
    <button data-theme="dark" class="active">🌙 Ночь</button>
    <button data-theme="light">☀️ День</button>
    <button data-theme="deuteranopia">👁️ Дальтоник</button>
  </div>

  <button id="myCastButton">📺 Подключить ТВ</button>
  <p id="status">Загрузка Google Cast...</p>

  <div class="file-upload-wrapper">
    <label for="fileInput">📁 Выберите видео (с телефона или компьютера)</label>
    <input type="file" id="fileInput" accept="video/*" />
  </div>

  <!-- Выбор сервиса: основной videovssylku -->
  <div class="service-selector">
    <label for="serviceSelect">Сервис:</label>
    <select id="serviceSelect">
      <option value="videovssylku" selected>⭐ videovssylku.ru (до 500 МБ, 10 дней)</option>
      <option value="tmpfiles">tmpfiles.org (до 100 МБ)</option>
    </select>
  </div>

  <div id="file-warning">⚠️ Максимальный размер файла – 500 МБ (видео хранятся 10 дней)</div>
  <button id="uploadButton" disabled>⬆ Загрузить и получить ссылку</button>

  <input
    id="videoUrl"
    type="url"
    placeholder="Вставьте прямую ссылку на MP4"
    value=""
  />
  <div class="url-hint">⚠️ Поддерживаются только прямые ссылки на MP4-файлы. YouTube и другие сайты не поддерживаются.</div>
  <div class="manual-link-hint">💡 Можно вставить ссылку вручную (например, из Google Диска)</div>

  <button id="playButton">▶ Запустить на ТВ</button>
  <button id="pauseButton">⏸ Пауза</button>
  <button id="stopButton">⏹ Остановить</button>

  <video id="preview" controls></video>
</main>

<script>
  // ---- DOM ----
  const statusElement = document.querySelector("#status");
  const urlInput = document.querySelector("#videoUrl");
  const preview = document.querySelector("#preview");
  const fileInput = document.querySelector("#fileInput");
  const uploadButton = document.querySelector("#uploadButton");
  const fileWarning = document.querySelector("#file-warning");
  const serviceSelect = document.querySelector("#serviceSelect");

  // ---- Функция обновления подсказки о лимите ----
  function updateServiceHint() {
    const service = serviceSelect.value;
    let maxSize, serviceName, extra;
    if (service === "videovssylku") {
      maxSize = 500;
      serviceName = "videovssylku.ru";
      extra = " (видео хранятся 10 дней)";
    } else {
      maxSize = 100;
      serviceName = "tmpfiles.org";
      extra = "";
    }
    if (fileInput.files.length === 0) {
      fileWarning.textContent = `⚠️ Максимальный размер файла – ${maxSize} МБ${extra}`;
      fileWarning.style.color = "var(--warning-text)";
    }
  }

  window.addEventListener('load', updateServiceHint);
  serviceSelect.addEventListener('change', function() {
    if (fileInput.files.length > 0) {
      fileInput.dispatchEvent(new Event('change'));
    } else {
      updateServiceHint();
    }
  });

  // ---- Темы ----
  const themeButtons = document.querySelectorAll(".theme-switcher button");
  const body = document.body;
  function setTheme(theme) {
    body.classList.remove("light", "deuteranopia");
    if (theme !== "dark") body.classList.add(theme);
    localStorage.setItem("theme", theme);
    themeButtons.forEach(btn => {
      btn.classList.toggle("active", btn.dataset.theme === theme);
    });
  }
  setTheme(localStorage.getItem("theme") || "dark");
  themeButtons.forEach(btn => btn.addEventListener("click", function() {
    setTheme(this.dataset.theme);
  }));

  // ---- Подключение к ТВ ----
  document.getElementById("myCastButton").addEventListener("click", function() {
    if (!window.castContext) {
      statusElement.textContent = "❌ Google Cast ещё не загружен";
      return;
    }
    const session = window.castContext.getCurrentSession();
    if (session) {
      statusElement.textContent = "✅ ТВ уже подключён";
      return;
    }
    window.castContext.requestSession()
      .then(() => statusElement.textContent = "✅ Телевизор подключён!")
      .catch(err => statusElement.textContent = "❌ Ошибка: " + err);
  });

  // ---- Проверка файла ----
  fileInput.addEventListener("change", function() {
    const file = this.files[0];
    if (!file) {
      uploadButton.disabled = true;
      updateServiceHint();
      return;
    }
    const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
    const service = serviceSelect.value;
    let maxSize = 500;
    let serviceName = "videovssylku.ru";
    if (service === "tmpfiles") {
      maxSize = 100;
      serviceName = "tmpfiles.org";
    }
    if (file.size > maxSize * 1024 * 1024) {
      fileWarning.textContent = `❌ Файл слишком большой (${sizeMB} МБ). Максимум для ${serviceName} – ${maxSize} МБ.`;
      fileWarning.style.color = "var(--error-text)";
      uploadButton.disabled = true;
      statusElement.textContent = `❌ Превышен лимит ${maxSize} МБ`;
    } else {
      fileWarning.textContent = `✅ Файл выбран (${sizeMB} МБ). Нажмите «Загрузить».`;
      fileWarning.style.color = "var(--success-text)";
      uploadButton.disabled = false;
      statusElement.textContent = "Файл готов к загрузке";
    }
  });

  // ---- Загрузка файла ----
  uploadButton.addEventListener("click", async () => {
    const file = fileInput.files[0];
    if (!file) {
      statusElement.textContent = "❌ Сначала выберите файл";
      return;
    }

    const service = serviceSelect.value;
    let maxSize = 500;
    if (service === "tmpfiles") maxSize = 100;
    if (file.size > maxSize * 1024 * 1024) {
      statusElement.textContent = `❌ Файл превышает ${maxSize} МБ`;
      return;
    }

    statusElement.textContent = "⏳ Загрузка на сервер...";
    uploadButton.disabled = true;

    try {
      let fileUrl = null;

      if (service === "tmpfiles") {
        const formData = new FormData();
        formData.append("file", file);
        const response = await fetch("https://tmpfiles.org/api/v1/upload", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        if (data.success) {
          fileUrl = data.url;
        } else {
          throw new Error(data.message || "Ошибка загрузки");
        }
      } else if (service === "videovssylku") {
        const formData = new FormData();
        formData.append("source", file);
        const response = await fetch("https://videovssylku.ru/api/1/upload", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        console.log("Ответ videovssylku:", data);
        if (data.status === 200 && data.image && data.image.url) {
          fileUrl = data.image.url;
        } else if (data.status === 200 && data.url) {
          fileUrl = data.url;
        } else {
          throw new Error(data.message || data.error || "Неизвестная ошибка");
        }
      }

      if (fileUrl) {
        urlInput.value = fileUrl;
        statusElement.textContent = "✅ Файл загружен! Ссылка вставлена.";
        preview.src = fileUrl;
        fileWarning.textContent = "✅ Готово! Можно отправлять на ТВ.";
        fileWarning.style.color = "var(--success-text)";
      } else {
        throw new Error("Не удалось получить ссылку");
      }
    } catch (error) {
      console.error(error);
      statusElement.textContent = "❌ Ошибка загрузки: " + error.message;
      fileWarning.textContent = "❌ Не удалось загрузить. Вставьте ссылку вручную.";
      fileWarning.style.color = "var(--error-text)";
    } finally {
      uploadButton.disabled = false;
    }
  });

  // ---- Отправка видео на ТВ ----
  document.querySelector("#playButton").addEventListener("click", async () => {
    const url = urlInput.value.trim();
    const title = "Видео";

    if (!url.startsWith("http://") && !url.startsWith("https://")) {
      statusElement.textContent = "❌ Вставьте HTTP или HTTPS ссылку";
      return;
    }
    if (!window.castContext) {
      statusElement.textContent = "❌ Google Cast не готов";
      return;
    }

    let session = window.castContext.getCurrentSession();
    if (!session) {
      try {
        session = await window.castContext.requestSession();
      } catch {
        statusElement.textContent = "❌ Сначала нажмите 'Подключить ТВ'";
        return;
      }
    }

    try {
      const mediaInfo = new chrome.cast.media.MediaInfo(url, "video/mp4");
      mediaInfo.streamType = chrome.cast.media.StreamType.BUFFERED;
      const metadata = new chrome.cast.media.GenericMediaMetadata();
      metadata.title = title;
      mediaInfo.metadata = metadata;

      const request = new chrome.cast.media.LoadRequest(mediaInfo);
      request.autoplay = true;
      request.currentTime = 0;

      await session.loadMedia(request);
      statusElement.textContent = "✅ Видео отправлено на телевизор";
    } catch (error) {
      console.error(error);
      statusElement.textContent = "❌ Ошибка отправки: " + error;
    }
  });

  // ---- Пауза и стоп ----
  document.querySelector("#pauseButton").addEventListener("click", () => {
    const session = window.castContext?.getCurrentSession();
    if (session) {
      const media = session.getMediaSession();
      if (media) media.pause(null);
    }
  });
  document.querySelector("#stopButton").addEventListener("click", () => {
    const session = window.castContext?.getCurrentSession();
    if (session) {
      const media = session.getMediaSession();
      if (media) media.stop(null);
    }
  });

  // ---- Предпросмотр ----
  urlInput.addEventListener("change", () => {
    preview.src = urlInput.value;
  });
</script>
</body>
</html>
